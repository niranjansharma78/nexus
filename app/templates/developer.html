<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexus Developer Console</title><link rel="stylesheet" href="/static/css/app.css"></head><body><main class="shell"><header class="title"><div><p class="eyebrow">NEXUS DP1-B002</p><h1>Developer Console</h1><p>Read-only evidence, entities and platform diagnostics.</p></div><a href="/">Back to Nexus</a></header><section class="confidenceBar"><div><span>External systems</span><b>READ ONLY</b></div><p>No connector can create, edit or delete external records.</p></section><section class="section"><div class="title"><h2>Recent evidence</h2></div><div id="evidence"></div></section></main><script>fetch('/api/evidence').then(r=>r.json()).then(a=>{document.getElementById('evidence').innerHTML='<div class="grid signals">'+a.slice(0,30).map(x=>`<article class="signal"><small>${x.source} · ${x.domain}</small><h3>${x.title}</h3><p>${x.summary}</p><div class="meta">${Math.round(x.confidence*100)}% · ${x.status}</div></article>`).join('')+'</div>'})</script></body></html>
