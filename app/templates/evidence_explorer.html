<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Evidence Explorer</title><link rel="stylesheet" href="/static/css/app.css">
<style>.filters{display:grid;grid-template-columns:2fr repeat(4,1fr) auto;gap:10px}input,select{padding:11px;border:1px solid var(--line);border-radius:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.e{background:white;border:1px solid var(--line);border-radius:18px;padding:16px}.tags{display:flex;flex-wrap:wrap;gap:6px}.tag{font-size:11px;padding:5px 8px;border-radius:999px;background:var(--soft);color:var(--primary)}@media(max-width:850px){.filters,.grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.filters,.grid{grid-template-columns:1fr}}</style>
</head><body><main class="shell"><header class="topbar"><div><p class="eyebrow">DEBUGGING</p><h1>Evidence Explorer</h1><p class="muted">See what Nexus read, interpreted and escalated.</p></div><a class="button" href="/developer-console">Developer Console</a></header>
<section class="card"><div class="filters">
<input id="q" placeholder="Search"><select id="source"><option value="">All sources</option><option>IMAP</option><option>Email</option><option>SMS</option><option>ERP</option><option>Calendar</option></select>
<select id="domain"><option value="">All domains</option><option>business</option><option>family</option><option>personal</option><option>digital</option></select>
<select id="category"><option value="">All categories</option><option>finance</option><option>procurement</option><option>recruitment</option><option>operations</option><option>promotion</option><option>communication</option><option>uncategorized</option></select>
<select id="signal"><option value="">Any signal</option><option value="70">70+</option><option value="50">50+</option><option value="30">30+</option></select><button id="apply" class="button">Apply</button></div></section>
<section class="section"><div class="title"><div><p class="eyebrow">RESULTS</p><h2 id="count">Loading</h2></div></div><div id="cards" class="grid"></div></section>
</main><script src="/static/js/evidence_explorer.js"></script></body></html>
