<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connections · Nexus</title><link rel="stylesheet" href="/static/css/connections_spaces.css"></head>
<body><main class="shell">
<header class="hero"><div><p class="eyebrow">MULTI-ACCOUNT</p><h1>Connections & Spaces</h1><p>Group multiple office mailboxes under the company or life space they belong to.</p></div><a href="/">Back Home</a></header>
<section class="section"><div class="head"><div><p class="eyebrow">SPACES</p><h2>Your companies and worlds</h2></div><button id="toggle">Add Space</button></div><div id="spaces" class="grid"></div></section>
<section id="form" class="card hidden"><input id="name" placeholder="Space name"><select id="world"><option value="business">Business</option><option value="family">Family</option><option value="personal">Personal</option><option value="digital">Digital</option></select><input id="desc" placeholder="Description"><button id="create">Create</button><span id="status"></span></section>
<section class="section"><div class="head"><div><p class="eyebrow">MAILBOXES</p><h2>Connected accounts</h2></div><a href="/mailboxes">Add Mailbox</a></div><div id="mailboxes" class="list"></div></section>
</main><script src="/static/js/connections_spaces.js"></script></body></html>
