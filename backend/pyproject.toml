[project]
name = "nexus"
version = "0.1.0"
description = "Nexus Intelligence Operating System"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "jinja2",
  "python-multipart",
  "itsdangerous",
  "httpx"
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
